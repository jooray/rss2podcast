[tool.poetry]
name = "rss2podcast"
version = "0.1.0"
description = ""
authors = ["Juraj Bednar <juraj@bednar.io>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
feedparser = "^6.0.11"
beautifulsoup4 = "^4.12.3"
markdownify = "^0.13.1"
lxml = "^5.3.0"
pytz = "^2024.2"
soundfile = "^0.12.1"
nltk = "^3.9.1"
